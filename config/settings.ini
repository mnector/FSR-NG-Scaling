# FSR-NG-Scaling runtime configuration
# Values are reloaded live on Ctrl+Alt+R (no restart required).

[engine]
# Neural upscale multiplier (integer >= 1). 1 = passthrough.
scale_factor=0.5
# safetensors model weights path (absolute or relative to exe).
model_path=models/fsr_ng_model.safetensors
# Optional expected SHA-256 of the model file for integrity verification.
# Leave empty to skip verification.
expected_sha256=

[neural]
# 0..1 : how strongly to apply the neural enhancement over the source.
intensity=0.75

[capture]
# Capture mode: "window" (upscale dynamic active foreground window) or "desktop" (full monitor).
capture_mode=desktop
# Application FPS limit. Set to 0 to disable (capture as fast as possible).
fps_limit=30
# Desktop downscale factor for OptiScaler Input (e.g. 0.5 for 50% internal resolution). 1.0 = native.
desktop_scale=0.5
# Output downscale factor for OptiScaler Output (e.g. 0.5 limits the AI network to 1080p, then stretches to 4K screen).
output_scale=0.5

[overlay]
# 0 = full neural output, 1 = split screen (left original / right neural).
debug_split_screen=0
# Overlay window class name (for debugging / targeting).
window_name=FSR-NG-Overlay

[hotkeys]
# Toggle live scaling on/off. Virtual-key code for 'S' = 83 (0x53).
toggle_key=83
# Reload settings.ini live. Virtual-key code for 'R' = 82 (0x52).
reload_key=82
# Toggle between Foreground Window mode and Full Desktop mode. 'W' = 87 (0x57).
toggle_mode_key=87
