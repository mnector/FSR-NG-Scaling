# FSR-NG-Scaling runtime configuration
# Values are reloaded live on Ctrl+Alt+R (no restart required).

[engine]
# Neural upscale multiplier (integer >= 1). 1 = passthrough.
scale_factor=2
# safetensors model weights path (absolute or relative to exe).
model_path=models/fsr_ng_model.safetensors
# Optional expected SHA-256 of the model file for integrity verification.
# Leave empty to skip verification.
expected_sha256=

[neural]
# 0..1 : how strongly to apply the neural enhancement over the source.
intensity=0.75
# 0..1 : structural detail / sharpening strength.
structure_intensity=0.40
# -1..1 : tone adjustment (-1 darkens, +1 brightens).
tone_intensity=0.10
# 0..0.95 : temporal accumulation strength ($S_{t-1}$) (set to 0.0 to eliminate ghosting).
temporal_stability=0.0
# 0..2.5 : OpenNR DLSS 5 generative micro-detail boost (synthesis of high-frequency textures).
detail_boost=1.35
# 0 or 1 : 1 = Catmull-Rom 9-tap bicubic spline filter, 0 = standard bilinear.
catmull_rom=1
# -1..1 : Skin Structure Strength (-1 smooths skin, +1 enhances pore/micro detail).
skin_structure_strength=-1.00
# 1..4 : Multi-pass neural reconstruction cascades.
nr_passes=1
# 0.5..3.0 : Scene Paper-White scale.
scene_paper_white=1.000
# 0..2.0 : HDR Transfer Strength.
hdr_transfer_strength=1.00
# 0..2.0 : Color Strength.
color_strength=1.00
# 1 = Enable DLSS Neural Rendering, 0 = Passthrough.
enable_nr=1
# 1 = Automatic Mask & Zero-Ghosting Motion Gating.
auto_mask=1

[capture]
# Capture mode: "window" (upscale dynamic active foreground window) or "desktop" (full monitor).
capture_mode=desktop

[overlay]
# 0 = full neural output, 1 = split screen (left original / right neural).
debug_split_screen=0
# Overlay window class name (for debugging / targeting).
window_name=FSR-NG-Overlay

[hotkeys]
# Toggle live scaling on/off. Virtual-key code for 'S' = 83 (0x53).
toggle_key=83
# Reload settings.ini live. Virtual-key code for 'R' = 82 (0x52).
reload_key=82
# Toggle between Foreground Window mode and Full Desktop mode. 'W' = 87 (0x57).
toggle_mode_key=87
