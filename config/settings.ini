[capture]
# Application FPS limit. Set to 0 to disable (capture as fast as possible).
fps_limit=0

[depth]
# Enable depth estimation for depth-aware upscaling (requires Depth-Anything-V2-Small model)
enabled=0
# Model path (relative to root)
model_path=models/depth/depth_anything_v2_vits.onnx
# Inference provider: ROCm, DirectML, CUDA, CPU (ROCm preferred for AMD R9700)
provider=ROCm

[scaling]
# Automatically adjust the base resolution using the primary monitor's DPI setting (1 = true, 0 = false)
auto_dpi_scale=1

# DLSS Mode: off, dlaa, auto, quality, balanced, performance, ultra_performance
dlss_mode=performance

[overlay]
# 0 = full neural output, 1 = split screen (left original / right neural).
debug_split_screen=0

[hotkeys]
# Toggle live scaling on/off. Virtual-key code for 'S' = 83 (0x53).
toggle_key=83
# Reload settings.ini live. Virtual-key code for 'R' = 82 (0x52).
reload_key=82
